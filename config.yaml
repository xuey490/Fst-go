# FST 跨网络配置（开发用；打包后请放在 fst.exe 同目录）
# 设置页「跨网络」保存时会改写本文件；修改后需重启生效。

# 等价于设置页的「允许跨网络」开关。关闭时只做局域网 mDNS 发现。
#enable_relay: false
#relays:
